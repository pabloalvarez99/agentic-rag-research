name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""
  COHERE_API_KEY: ""
  PRODUCTION_RAG_URL: ""

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --strict

      - name: Test
        run: pytest -q
        # Prove the credential-free path: if the code silently starts requiring a key,
        # CI goes red rather than passing on a secret this workflow never sets.

      - name: Prove the credential-free research demo
        run: bash scripts/demo_research.sh

      - name: Prove the credential-free HTTP path
        run: |
          python -m uvicorn agentic_rag.main:app --host 127.0.0.1 --port 8010 > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8010/health > /dev/null; then
              break
            fi
            sleep 1
          done
          response=$(curl --fail --silent http://127.0.0.1:8010/health)
          RESPONSE="$response" python -c 'import json, os; payload=json.loads(os.environ["RESPONSE"]); assert payload["status"] == "ok", payload'

      - name: Show the API log after a failure
        if: failure()
        run: cat api.log || true
