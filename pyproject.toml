[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-research"
version = "0.1.0"
description = "Agentic RAG research agent: a plan / retrieve / critique loop over a retrieval service, runnable end to end on deterministic local providers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agent",
    "agentic-rag",
    "retrieval-augmented-generation",
    "fastapi",
    "research",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Dependencies land with the code that needs them: a dependency declared before
# its first import is a dependency nobody can tell is still required. httpx
# arrives with M1 because the retrieve tool's opt-in HTTP path imports it (and
# the test client has always used it).
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

# Google-style docstring sections, matching series #1 (production-rag). Without a
# declared convention ruff enforces every style's rules at once, and D413 fires on
# an ``Args:``/``Returns:`` block that ends where the docstring ends.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
